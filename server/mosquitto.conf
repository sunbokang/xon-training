# mosquitto.conf
# 리스너 2개: 1883(Python 수집기/시뮬레이터), 9001(브라우저 WebSocket)
log_dest stdout
log_type all

listener 1883
protocol mqtt

listener 9001
protocol websockets

# 지하 환경: 엣지가 복구 시 밀어넣는 버퍼를 받아내도록 큐 넉넉히
max_queued_messages 100000
message_size_limit 0

# 테스트 단계 익명 허용 (운영 시 인증 켜기)
allow_anonymous true
