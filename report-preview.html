<script>
const {createElement:e, useState}=React;
const {RadarChart,Radar,PolarGrid,PolarAngleAxis,PolarRadiusAxis,
       BarChart,Bar,LineChart,Line,AreaChart,Area,XAxis,YAxis,CartesianGrid,
       Tooltip,Legend,ResponsiveContainer,Cell,ReferenceLine}=Recharts;
const O="#E05D29";
let R=REPORT;   // 기본: 내장 예시 데이터. ?athlete=<dbId> 있으면 DB에서 로드.

/* URL 파라미터로 실제 DB 리포트 로드 (선택) */
async function tryLoadFromDB(){
  const params=new URLSearchParams(location.search);
  const dbId=params.get("athlete");
  if(!dbId) return null;
  // Supabase 설정 (localStorage 공유)
  let cfg={url:"",key:""};
  try{ cfg=JSON.parse(localStorage.getItem("xon_supabase_cfg")||"{}"); }catch(e){}
  if(!cfg.url||!cfg.key||typeof window.supabase==="undefined") return null;
  try{
    const sb=window.supabase.createClient(cfg.url,cfg.key);
    const {data:results}=await sb.from("results").select("*").eq("athlete_id",dbId).order("created_at",{ascending:false}).limit(1);
    if(!results||!results[0]) return null;
    const result=results[0];
    const {data:ath}=await sb.from("target_athletes").select("*").eq("id",dbId).limit(1);
    const {data:splits}=await sb.from("splits").select("*").eq("result_id",result.id).order("id");
    const {data:cache}=await sb.from("analysis_cache").select("*").eq("result_id",result.id).limit(1);
    const {data:samples}=await sb.from("live_samples").select("elapsed_sec,bpm").eq("athlete_id",dbId).order("elapsed_sec");
    const a=(ath&&ath[0])||{};
    const an=(cache&&cache[0])||{};
    // DB → REPORT 형태로 변환
    const spl=(splits||[]).map((x,i)=>({k:x.step_key,sec:Math.round(x.split_ms/1000),target:x.target_sec,label:x.label,idx:i}));
    return {
      athlete:{name:a.name||"선수",en:a.en_name||"",div:a.division||"",age:a.age_group||"",
               targetSec:a.target_sec||result.target_total_sec||3600,maxHr:a.max_hr||188,
               date:(result.created_at||"").slice(0,10)},
      totalSec:Math.round((result.total_ms||0)/1000),
      splits:spl,
      analysis:{
        baseline:{mean:an.baseline_mean||0,sd:0,cv:0},
        taxes:an.taxes_json||[], strengthDrop:an.strength_drop, bodyweightDrop:an.bodyweight_drop,
        avgDrop:((an.strength_drop||0)+(an.bodyweight_drop||0))/2,
        profile:an.profile||"Unknown", tendency:({Runner:"러닝형",Strength:"스트렝스형",Balanced:"밸런스형"})[an.profile]||"분석",
        profileDesc:"", stationEff:[], radar:an.radar_json||[],
        strengths:(an.radar_json||[]).slice().sort((x,y)=>y.score-x.score).slice(0,2),
        weaknesses:(an.radar_json||[]).slice().sort((x,y)=>y.score-x.score).slice(-2).reverse(),
      },
      gemini:result.coaching_report||{summary:result.coaching_summary||"",priorities:[],station_drills:[],race_tactics:[]},
      hrTrend:(samples||[]).map(s=>({t:Math.round(s.elapsed_sec/60*10)/10,bpm:s.bpm})),
    };
  }catch(e){ console.warn("DB 로드 실패, 내장 데이터 사용:",e); return null; }
}

const mmss=s=>{if(s==null)return"--:--";const n=Math.abs(Math.round(s));return String(Math.floor(n/60)).padStart(2,"0")+":"+String(n%60).padStart(2,"0");};
const signed=s=>(s>=0?"+":"-")+mmss(s);

/* 브랜드 로고 */
function Logo({size="text-xl"}){
  return e("div",{className:`${size} tracking-tighter leading-none`},
    e("span",{className:"font-extrabold text-hyrox"},"XON"),
    e("span",{className:"font-light p-text"}," TRAINING"));
}
function Section({title,sub,children,brk}){
  return e("section",{className:"print-block mb-4 rounded-2xl border border-neutral-800 bg-neutral-950 p-4 md:p-5 p-card"+(brk?" print-break":"")},
    e("h2",{className:"text-lg font-black p-text"},title),
    sub?e("p",{className:"text-xs text-neutral-500 mt-0.5 mb-3 p-muted"},sub):e("div",{className:"mb-3"}),
    children);
}

function severityBadge(sev){
  const map={minimal:["최소","text-green-400 bg-green-500/10"],mild:["경미","text-yellow-400 bg-yellow-500/10"],
    moderate:["중간","text-orange-400 bg-orange-500/10"],severe:["심각","text-red-400 bg-red-500/10"]};
  const [ko,cls]=map[sev]||["-",""];
  return e("span",{className:`text-[10px] font-black px-1.5 py-0.5 rounded ${cls}`},ko);
}

function App(){
  const [ai,setAi]=useState(false);
  const a=R.analysis, at=R.athlete;

  // 목표 vs 실제
  const cmp=R.splits.map(s=>({name:(s.label==="Run"?"Run":s.label).replace(/ .*/,""),
    목표:s.target,실제:s.sec, over:s.sec>s.target}));
  // 방사형
  const radar=a.radar;
  // Stationary Tax 차트
  const taxData=a.taxes.map(t=>({name:t.label,드롭:t.dropPct,z:t.z,group:t.group}));

  return e("div",{className:"max-w-5xl mx-auto p-4 md:p-6"},
    // 인쇄 버튼
    e("div",{className:"no-print flex items-center justify-between mb-5"},
      e("p",{className:"text-xs text-neutral-500"},"룰 엔진 정량 분석 → Gemini 처방. A4 인쇄/PDF 저장 가능."),
      e("button",{onClick:()=>window.print(),
        className:"bg-hyrox hover:bg-[#c94e20] text-white font-bold px-5 py-2.5 rounded-xl"},"🖨 PDF 저장 / 인쇄")),

    // 헤더
    e("header",{className:"print-block mb-5 rounded-2xl border border-neutral-800 bg-neutral-950 p-5 p-card"},
      e("div",{className:"flex flex-wrap items-start justify-between gap-3"},
        e("div",null,
          e(Logo,{size:"text-lg"}),
          e("h1",{className:"text-2xl md:text-3xl font-black mt-2 p-text"},"엘리트 분석 리포트"),
          e("p",{className:"text-neutral-400 mt-1 p-sub"},
            e("span",{className:"text-lg font-bold text-white p-text"},at.name),
            ` ${at.en} · ${at.div} · ${at.age}`)),
        e("div",{className:"text-right"},
          e("p",{className:"text-[10px] uppercase tracking-widest text-neutral-500 p-muted"},"프로파일"),
          e("p",{className:"text-2xl font-black text-hyrox"},a.tendency),
          e("p",{className:"text-[11px] text-neutral-500 p-muted mt-1"},`측정일 ${at.date}`)))),

    // 요약 카드
    e("div",{className:"print-block grid grid-cols-2 lg:grid-cols-4 gap-3 mb-4"},
      [["총 기록",mmss(R.totalSec),`목표 ${mmss(at.targetSec)}`,R.totalSec>at.targetSec?"text-red-400":"text-green-400"],
       ["기준 러닝",mmss(a.baseline.mean),`편차 ±${a.baseline.sd}초`,"text-neutral-100 p-text"],
       ["근력종목 Tax",`+${a.strengthDrop}%`,"Sled 계열","text-red-400"],
       ["체중종목 Tax",`+${a.bodyweightDrop}%`,"Burpee+Lunge","text-orange-400"]].map((c,i)=>
        e("div",{key:i,className:"rounded-xl border border-neutral-800 bg-neutral-950 p-3 p-card"},
          e("p",{className:"text-[10px] uppercase tracking-widest text-neutral-500 p-muted"},c[0]),
          e("p",{className:`text-2xl font-black tabular ${c[3]}`},c[1]),
          e("p",{className:"text-[11px] text-neutral-600 mt-0.5 p-muted"},c[2])))),

    // 프로파일 설명
    e("div",{className:"print-block mb-4 rounded-2xl border border-hyrox/40 bg-hyrox/10 p-4 p-card"},
      e("p",{className:"text-sm font-black text-hyrox mb-1"},`${a.tendency} · ${a.profile}`),
      e("p",{className:"text-sm text-neutral-200 leading-relaxed p-text"},a.profileDesc)),

    // 1. 방사형 + 강약점
    e("div",{className:"grid grid-cols-1 lg:grid-cols-2 gap-4"},
      e(Section,{title:"1. 종합 능력 프로파일",sub:"룰 엔진 5축 · 100점 만점"},
        e("div",{className:"h-64 chart-h"},
          e(ResponsiveContainer,{width:"100%",height:"100%"},
            e(RadarChart,{data:radar},
              e(PolarGrid,{stroke:"#404040"}),
              e(PolarAngleAxis,{dataKey:"axis",tick:{fill:"#a3a3a3",fontSize:11}}),
              e(PolarRadiusAxis,{domain:[0,100],tick:{fill:"#525252",fontSize:9}}),
              e(Radar,{dataKey:"score",stroke:O,fill:O,fillOpacity:0.5})))),
      ),
      e(Section,{title:"2. 강점 · 약점",sub:"방사형 상·하위 항목"},
        e("div",{className:"space-y-3"},
          e("div",null,
            e("p",{className:"text-[11px] uppercase tracking-widest text-green-500 mb-1.5"},"STRENGTHS 강점"),
            a.strengths.map((s,i)=>e("div",{key:i,className:"flex items-center justify-between py-1.5 border-b border-neutral-800/50 p-card"},
              e("span",{className:"text-sm text-neutral-200 p-text"},s.axis),
              e("span",{className:"text-sm font-black text-green-400 tabular"},s.score)))),
          e("div",null,
            e("p",{className:"text-[11px] uppercase tracking-widest text-red-500 mb-1.5"},"WEAKNESSES 약점"),
            a.weaknesses.map((s,i)=>e("div",{key:i,className:"flex items-center justify-between py-1.5 border-b border-neutral-800/50 p-card"},
              e("span",{className:"text-sm text-neutral-200 p-text"},s.axis),
              e("span",{className:"text-sm font-black text-red-400 tabular"},s.score))))))),

    // 3. Stationary Tax
    e(Section,{title:"3. Stationary Tax · 종목별 페이스 저하",
      sub:`기준선(깨끗한 러닝 ${mmss(a.baseline.mean)})을 넘어선 정도. z는 이 선수 러닝 편차의 몇 배인지를 뜻합니다(고정 임계 아님).`},
      e("div",{className:"h-56 chart-h mb-3"},
        e(ResponsiveContainer,{width:"100%",height:"100%"},
          e(BarChart,{data:taxData,margin:{top:5,right:5,left:-15,bottom:5}},
            e(CartesianGrid,{strokeDasharray:"3 3",stroke:"#262626"}),
            e(XAxis,{dataKey:"name",tick:{fill:"#737373",fontSize:10}}),
            e(YAxis,{tick:{fill:"#737373",fontSize:10},label:{value:"드롭 %",angle:-90,position:"insideLeft",fill:"#737373",fontSize:10}}),
            e(Tooltip,{contentStyle:{background:"#0A0A0A",border:"1px solid #404040",borderRadius:8},formatter:(v)=>`+${v}%`}),
            e(Bar,{dataKey:"드롭",radius:[3,3,0,0]},
              taxData.map((d,i)=>e(Cell,{key:i,fill:d.group==="strength"?O:"#fb923c"})))))),
      e("div",{className:"space-y-1.5"},
        a.taxes.map((t,i)=>e("div",{key:i,className:"flex items-center justify-between px-3 py-2 rounded-lg bg-neutral-900 border border-neutral-800 p-card"},
          e("div",{className:"flex items-center gap-2 min-w-0"},
            severityBadge(t.severity),
            e("span",{className:"text-sm text-neutral-300 p-text truncate"},`${t.label} 직후 러닝`)),
          e("div",{className:"flex items-center gap-3 shrink-0"},
            e("span",{className:"text-[11px] text-neutral-600 tabular p-muted"},`회복 ${t.hrRecovery??"-"}bpm`),
            e("span",{className:"text-[11px] text-neutral-500 tabular p-muted"},`z=${t.z}`),
            e("span",{className:`text-sm font-black tabular ${t.dropPct>12?"text-red-400":t.dropPct>6?"text-orange-400":"text-green-400"}`},`+${t.dropPct}%`))))))
    ,

    // 4. 목표 vs 실제
    e(Section,{title:"4. 목표 대비 실제 기록"},
      e("div",{className:"h-64 chart-h"},
        e(ResponsiveContainer,{width:"100%",height:"100%"},
          e(BarChart,{data:cmp,margin:{top:5,right:5,left:-15,bottom:40}},
            e(CartesianGrid,{strokeDasharray:"3 3",stroke:"#262626"}),
            e(XAxis,{dataKey:"name",angle:-45,textAnchor:"end",height:60,tick:{fill:"#737373",fontSize:9}}),
            e(YAxis,{tick:{fill:"#737373",fontSize:10}}),
            e(Tooltip,{contentStyle:{background:"#0A0A0A",border:"1px solid #404040",borderRadius:8},formatter:v=>mmss(v)}),
            e(Legend,{wrapperStyle:{fontSize:12}}),
            e(Bar,{dataKey:"목표",fill:"#525252",radius:[3,3,0,0]}),
            e(Bar,{dataKey:"실제",fill:O,radius:[3,3,0,0]}))))),

    // 5. 심박 추이
    e(Section,{title:"5. 심박 추이 · Start → Finish",sub:`추정 최대심박 ${at.maxHr}bpm`},
      e("div",{className:"h-52 chart-h"},
        e(ResponsiveContainer,{width:"100%",height:"100%"},
          e(AreaChart,{data:R.hrTrend,margin:{top:5,right:5,left:-15,bottom:5}},
            e("defs",null,
              e("linearGradient",{id:"hg",x1:"0",y1:"0",x2:"0",y2:"1"},
                e("stop",{offset:"0%",stopColor:O,stopOpacity:0.5}),
                e("stop",{offset:"100%",stopColor:O,stopOpacity:0}))),
            e(CartesianGrid,{strokeDasharray:"3 3",stroke:"#262626"}),
            e(XAxis,{dataKey:"t",tick:{fill:"#737373",fontSize:10},label:{value:"경과(분)",position:"insideBottom",offset:-3,fill:"#737373",fontSize:10}}),
            e(YAxis,{domain:[130,185],tick:{fill:"#737373",fontSize:10}}),
            e(Tooltip,{contentStyle:{background:"#0A0A0A",border:"1px solid #404040",borderRadius:8},formatter:v=>v+" bpm"}),
            e(ReferenceLine,{y:Math.round(at.maxHr*0.9),stroke:"#ef4444",strokeDasharray:"4 4"}),
            e(ReferenceLine,{y:Math.round(at.maxHr*0.8),stroke:O,strokeDasharray:"4 4"}),
            e(Area,{type:"monotone",dataKey:"bpm",stroke:O,strokeWidth:2,fill:"url(#hg)",dot:false}))))),

    // 6. Gemini
    e(Section,{title:"6. AI 코칭 처방 (Gemini)",sub:"위 정량 수치를 근거로 생성된 맞춤 훈련 처방",brk:true},
      !ai
        ? e("div",{className:"no-print text-center py-6"},
            e("button",{onClick:()=>setAi(true),
              className:"bg-hyrox hover:bg-[#c94e20] text-white font-bold px-6 py-3 rounded-xl"},"AI 코칭 처방 생성"),
            e("p",{className:"text-[11px] text-neutral-600 mt-2"},"실제 배포 시 Gemini API 호출 · 프리뷰는 예시 응답"))
        : e("div",{className:"space-y-4"},
            e("p",{className:"text-neutral-200 leading-relaxed text-sm p-text"},R.gemini.summary),
            e("div",{className:"grid grid-cols-1 md:grid-cols-2 gap-4"},
              e("div",{className:"rounded-xl border border-neutral-800 bg-neutral-900 p-4 p-card"},
                e("p",{className:"text-[11px] uppercase tracking-widest text-neutral-500 mb-2 p-muted"},"4주 훈련 우선순위"),
                e("ul",{className:"space-y-1.5"},R.gemini.priorities.map((p,i)=>
                  e("li",{key:i,className:"text-sm text-neutral-300 flex gap-2 p-text"},
                    e("span",{className:"text-hyrox font-black"},i+1),e("span",null,p))))),
              e("div",{className:"rounded-xl border border-neutral-800 bg-neutral-900 p-4 p-card"},
                e("p",{className:"text-[11px] uppercase tracking-widest text-neutral-500 mb-2 p-muted"},"실전 당일 팁"),
                e("ul",{className:"space-y-1.5"},R.gemini.race_tactics.map((p,i)=>
                  e("li",{key:i,className:"text-sm text-neutral-300 flex gap-2 p-text"},
                    e("span",{className:"text-hyrox"},"•"),e("span",null,p)))))),
            e("div",null,
              e("p",{className:"text-[11px] uppercase tracking-widest text-neutral-500 mb-2 p-muted"},"종목별 실전 기법"),
              e("div",{className:"space-y-2"},R.gemini.station_drills.map((d,i)=>
                e("div",{key:i,className:"rounded-lg border border-neutral-800 bg-neutral-900 p-3 p-card"},
                  e("p",{className:"text-hyrox font-semibold text-sm"},d.station),
                  e("p",{className:"text-neutral-300 text-sm mt-0.5 p-text"},d.drill))))))),

    // 푸터
    e("footer",{className:"print-block mt-6 pt-5 border-t border-neutral-800 p-card flex items-center justify-between"},
      e("p",{className:"text-[11px] text-neutral-500 p-muted"},"ⓒ sunbo kang. All rights reserved."),
      e(Logo,{size:"text-lg"})));
}

const _root=ReactDOM.createRoot(document.getElementById("root"));
// DB에서 로드 시도 후 렌더 (실패 시 내장 데이터)
(async()=>{
  try{
    const fromDb=await tryLoadFromDB();
    if(fromDb) R=fromDb;
  }catch(e){}
  _root.render(e(App));
})();
</script>
</body>
</html>
