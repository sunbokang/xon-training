# telegraf.conf — MQTT(hyrox/live/+) → InfluxDB v2 (선택 사항)
[agent]
  interval = "1s"
  flush_interval = "5s"

[[inputs.mqtt_consumer]]
  servers = ["tcp://localhost:1883"]
  topics = ["hyrox/live/+"]
  qos = 1
  data_format = "json_v2"

  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "heart_rate"
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "athlete_id"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "BPM"
      type = "int"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "RMSSD"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "GCT"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "CADENCE"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "RESPIRATION"
      type = "float"

[[outputs.influxdb_v2]]
  urls = ["http://localhost:8086"]
  token = "YOUR_INFLUXDB_TOKEN"
  organization = "hyrox"
  bucket = "hyrox_live"
